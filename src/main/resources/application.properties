spring.application.name=pharmacie
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacie_db
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Load data.sql after Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.thymeleaf.cache=false

logging.pattern.console=%clr(%d{HH:mm:ss:SSS}){blue} %clr(%-5level){green} %clr(%t){red} %clr(%logger{15}){yellow} - %cyan(%m%n)
