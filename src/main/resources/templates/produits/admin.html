<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Admin</title></head>
<body>
<h2>Gestion des utilisateurs</h2>
<a th:href="@{/home}">Accueil</a>
<table border="1">
    <tr><th>ID</th><th>Utilisateur</th><th>Rôles</th><th>Actif</th></tr>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.username}"></td>
        <td><span th:each="r : ${u.roles}" th:text="${r.name + ' '}"></span></td>
        <td th:text="${u.enabled}"></td>
    </tr>
</table>
</body>
</html>
